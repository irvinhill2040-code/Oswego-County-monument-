<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="OCM">
<meta name="theme-color" content="#1a5fb4">
<link rel="manifest" href="data:application/json,{&quot;name&quot;:&quot;Oswego County Monument&quot;,&quot;short_name&quot;:&quot;OCM&quot;,&quot;display&quot;:&quot;standalone&quot;,&quot;background_color&quot;:&quot;%23f5f3ef&quot;,&quot;theme_color&quot;:&quot;%231a5fb4&quot;,&quot;start_url&quot;:&quot;.&quot;}">
<title>Oswego County Monument</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f5f3ef;color:#1c1a17;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
:root{
  --blue:#1a5fb4;--blue-light:#deeaf8;--blue-dark:#0d3d78;
  --green:#2d6a2d;--green-light:#e6f3e6;
  --amber:#8a5c00;--amber-light:#fdf3dc;
  --red:#a02020;--red-light:#fdeaea;
  --teal:#0d6b6b;--teal-light:#e0f5f5;
  --stone:#5c5650;--stone-light:#f0ede8;
  --purple:#5b21b6;--purple-light:#ede9fe;
  --pink:#be185d;--pink-light:#fce7f3;
  --border:#e2ddd6;--radius:12px;--radius-sm:8px;
}
input,select,textarea,button{font-family:inherit;font-size:14px}
button{cursor:pointer;border:none;background:none}
a{text-decoration:none;color:inherit}
.topbar{position:sticky;top:0;z-index:100;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;padding:0 14px;height:54px;flex-shrink:0}
.brand-icon{width:32px;height:32px;border-radius:9px;background:var(--blue);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.brand-icon svg{width:17px;height:17px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.brand-text{font-size:15px;font-weight:700;color:#1c1a17;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar-btn{width:36px;height:36px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;color:#7a736a;border:1px solid var(--border);background:#fff;flex-shrink:0}
.topbar-btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.loc-bar-wrap{background:#fff;border-bottom:1px solid var(--border);padding:8px 14px;overflow-x:auto;white-space:nowrap;scrollbar-width:none;flex-shrink:0}
.loc-bar-wrap::-webkit-scrollbar{display:none}
.loc-chip{display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border-radius:99px;border:1px solid var(--border);background:#fff;font-size:12px;font-weight:500;color:#7a736a;cursor:pointer;white-space:nowrap;margin-right:6px}
.loc-chip.active{background:var(--blue);border-color:var(--blue);color:#fff}
.loc-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.page{padding:14px;max-width:720px;margin:0 auto;width:100%;padding-bottom:92px;display:none}
.page.active{display:block}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:100;background:#fff;border-top:1px solid var(--border);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 6px;border:none;background:none;color:#9a9088;font-size:10px;font-weight:500}
.nav-btn.active{color:var(--blue)}
.nav-btn svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav-btn.active svg{stroke-width:2.3}
.card{background:#fff;border-radius:var(--radius);border:1px solid var(--border);overflow:hidden;margin-bottom:12px}
.card-header{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.card-title{font-size:13px;font-weight:600}
.section-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:#9a9088;margin:16px 0 8px 2px}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.metrics-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}
.metric{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:13px}
.metric-icon{width:30px;height:30px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;margin-bottom:9px}
.metric-icon svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.metric-val{font-size:22px;font-weight:700;line-height:1;color:#1c1a17}
.metric-lbl{font-size:11px;color:#9a9088;margin-top:3px}
.qstat{background:#fff;border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px;text-align:center}
.qstat-val{font-size:18px;font-weight:700;color:#1c1a17}
.qstat-lbl{font-size:10px;color:#9a9088;margin-top:2px}
.row{display:flex;align-items:center;gap:11px;padding:12px 14px;border-bottom:1px solid #f0ede8;cursor:pointer;-webkit-user-select:none;user-select:none;transition:background .1s}
.row:last-child{border-bottom:none}
.row:active{background:#f8f6f3}
.row-main{flex:1;min-width:0}
.row-title{font-size:14px;font-weight:500;color:#1c1a17;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-sub{font-size:12px;color:#9a9088;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.order-num{font-size:12px;font-weight:700;color:var(--blue);width:36px;flex-shrink:0}
.chev{width:15px;height:15px;stroke:#d0c8c0;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600;white-space:nowrap}
.b-blue{background:var(--blue-light);color:var(--blue)}
.b-green{background:var(--green-light);color:var(--green)}
.b-amber{background:var(--amber-light);color:var(--amber)}
.b-red{background:var(--red-light);color:var(--red)}
.b-teal{background:var(--teal-light);color:var(--teal)}
.b-stone{background:var(--stone-light);color:var(--stone)}
.b-purple{background:var(--purple-light);color:var(--purple)}
.b-pink{background:var(--pink-light);color:var(--pink)}
.fsec{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:12px}
.fsec-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#9a9088;margin-bottom:11px;display:flex;align-items:center;justify-content:space-between}
.field{margin-bottom:11px}
.field:last-child{margin-bottom:0}
.field label{display:block;font-size:12px;font-weight:500;color:#5c5650;margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;padding:10px 11px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:14px;color:#1c1a17;background:#fff;-webkit-appearance:none;appearance:none}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(26,95,180,.1)}
.field textarea{resize:none;min-height:76px;line-height:1.5}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.frow3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 18px;border-radius:var(--radius-sm);font-size:14px;font-weight:600;cursor:pointer;border:none;transition:opacity .15s}
.btn:active{opacity:.75}
.btn-primary{background:var(--blue);color:#fff}
.btn-ghost{background:#f0ede8;color:#3c3830}
.btn-danger{background:var(--red-light);color:var(--red);border:1px solid #f0b8b8}
.btn-green{background:var(--green-light);color:var(--green);border:1px solid #b8d8b8}
.btn-purple{background:var(--purple-light);color:var(--purple);border:1px solid #c4b5fd}
.btn-amber{background:var(--amber-light);color:var(--amber);border:1px solid #e8c96a}
.btn-teal{background:var(--teal-light);color:var(--teal);border:1px solid #9dd3d3}
.btn-full{width:100%}
.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.btn-row{display:flex;gap:10px;margin-top:18px}
.btn-row .btn{flex:1}
.status-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.sopt{padding:9px 8px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:12px;font-weight:500;color:#5c5650;text-align:center;cursor:pointer;transition:all .15s;-webkit-user-select:none}
.sopt.on{border-color:var(--blue);background:var(--blue-light);color:var(--blue);font-weight:700}
.sopt:active{opacity:.7}
.act-item{display:flex;gap:11px;padding:11px 0;border-bottom:1px solid #f0ede8}
.act-item:last-child{border-bottom:none}
.act-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:4px}
.act-title{font-size:13px;font-weight:500;color:#1c1a17}
.act-sub{font-size:12px;color:#9a9088;margin-top:1px}
.act-time{font-size:11px;color:#c5bfb8;margin-top:2px}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.dgrid dt{font-size:11px;color:#9a9088;margin-bottom:2px}
.dgrid dd{font-size:13px;font-weight:600;color:#1c1a17}
.srch{position:relative;margin-bottom:12px}
.srch input{width:100%;padding:10px 12px 10px 36px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:14px;background:#fff}
.srch input:focus{outline:none;border-color:var(--blue)}
.srch svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;stroke:#9a9088;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pills{display:flex;gap:7px;overflow-x:auto;padding-bottom:2px;margin-bottom:12px;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pill{padding:5px 13px;border-radius:99px;border:1px solid var(--border);background:#fff;font-size:12px;font-weight:500;color:#7a736a;white-space:nowrap;cursor:pointer;flex-shrink:0;-webkit-user-select:none}
.pill.on{background:var(--blue);border-color:var(--blue);color:#fff}
.overlay{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;animation:fadeIn .2s ease}
.drawer{background:#fff;border-radius:18px 18px 0 0;width:100%;max-height:93vh;overflow-y:auto;padding:14px 14px calc(env(safe-area-inset-bottom)+20px);animation:slideUp .25s ease}
.dhandle{width:34px;height:4px;background:#e2ddd6;border-radius:99px;margin:0 auto 16px}
.dtitle{font-size:16px;font-weight:700;color:#1c1a17;margin-bottom:14px}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translateY(60px);opacity:0}to{transform:translateY(0);opacity:1}}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--blue-light);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--blue);flex-shrink:0}
.dblock{text-align:center;width:40px;flex-shrink:0;background:var(--stone-light);border-radius:var(--radius-sm);padding:5px 3px}
.dblock .dy{font-size:17px;font-weight:700;line-height:1;color:#1c1a17}
.dblock .mo{font-size:9px;text-transform:uppercase;color:#9a9088;margin-top:1px}
.dblock.soon{background:var(--amber-light)}
.dblock.soon .dy{color:var(--amber)}
.dblock.today{background:var(--blue-light)}
.dblock.today .dy{color:var(--blue)}
.empty{text-align:center;padding:44px 20px}
.empty-icon{width:48px;height:48px;border-radius:50%;background:var(--blue-light);display:flex;align-items:center;justify-content:center;margin:0 auto 12px}
.empty-icon svg{width:22px;height:22px;stroke:var(--blue);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.empty h3{font-size:15px;font-weight:600;color:#3c3830;margin-bottom:5px}
.empty p{font-size:13px;color:#9a9088}
.toast-el{position:fixed;bottom:82px;left:50%;transform:translateX(-50%);background:#1c1a17;color:#fff;padding:10px 18px;border-radius:99px;font-size:13px;font-weight:500;z-index:999;pointer-events:none;white-space:nowrap;transition:opacity .3s}
.banner{border-radius:var(--radius-sm);padding:10px 13px;margin-bottom:12px;font-size:13px;font-weight:500;line-height:1.4}
.banner-amber{background:var(--amber-light);color:var(--amber);border:1px solid #e8c96a}
.banner-red{background:var(--red-light);color:var(--red);border:1px solid #f0b8b8}
.banner-green{background:var(--green-light);color:var(--green);border:1px solid #b8d8b8}
.banner-blue{background:var(--blue-light);color:var(--blue);border:1px solid #b8d0f0}
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.photo-thumb{position:relative;aspect-ratio:1;border-radius:var(--radius-sm);overflow:hidden;background:#f0ede8;cursor:pointer}
.photo-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.photo-thumb .del-photo{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;border:none;cursor:pointer;z-index:2}
.photo-thumb .del-photo svg{width:11px;height:11px;stroke:#fff;fill:none;stroke-width:2.5;stroke-linecap:round}
.photo-thumb .photo-label{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,.6));color:#fff;font-size:9px;padding:8px 5px 4px;line-height:1.2;text-transform:uppercase;letter-spacing:.04em}
.photo-add-btn{aspect-ratio:1;border-radius:var(--radius-sm);border:2px dashed var(--border);background:#fafaf8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer;color:#9a9088;font-size:11px;font-weight:500;-webkit-user-select:none}
.photo-add-btn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.psheet-btn{display:flex;align-items:center;gap:14px;padding:14px 4px;border-bottom:1px solid var(--border);cursor:pointer;-webkit-user-select:none}
.psheet-btn:last-of-type{border-bottom:none}
.psheet-btn:active{opacity:.7}
.psi{width:40px;height:40px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.psi svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pstext{font-size:15px;font-weight:500}
.psub{font-size:12px;color:#9a9088;margin-top:1px}
.lightbox{position:fixed;inset:0;z-index:500;background:#000;display:flex;flex-direction:column}
.lightbox-top{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top));flex-shrink:0}
.lightbox-top span{color:#fff;font-size:13px;font-weight:500}
.lightbox-close{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;cursor:pointer}
.lightbox-close svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:2.5;stroke-linecap:round}
.lightbox-img{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:10px}
.lightbox-img img{max-width:100%;max-height:100%;object-fit:contain;border-radius:var(--radius-sm)}
.design-upload-area{border:2px dashed var(--border);border-radius:var(--radius-sm);padding:16px;text-align:center;cursor:pointer;background:#fafaf8;margin-top:6px;transition:border-color .15s}
.design-upload-area svg{width:28px;height:28px;stroke:#9a9088;fill:none;stroke-width:1.8;margin-bottom:6px}
.design-upload-area p{font-size:12px;color:#9a9088}
.design-file-preview{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--blue-light);border-radius:var(--radius-sm);margin-top:6px}
.design-file-preview svg{width:20px;height:20px;stroke:var(--blue);fill:none;stroke-width:2;flex-shrink:0}
.design-file-info{flex:1;min-width:0}
.design-file-info .fname{font-size:13px;font-weight:600;color:var(--blue);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.design-file-info .fsize{font-size:11px;color:#5c5650}
.inv-summary{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px}
.inv-stat{background:#fff;border:1px solid var(--border);border-radius:var(--radius-sm);padding:11px 10px;text-align:center}
.inv-stat-val{font-size:17px;font-weight:700;color:#1c1a17}
.inv-stat-lbl{font-size:10px;color:#9a9088;margin-top:2px}
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.cal-nav h2{font-size:17px;font-weight:700;color:#1c1a17}
.cal-nav-btn{width:34px;height:34px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;border:1px solid var(--border);background:#fff;cursor:pointer}
.cal-nav-btn svg{width:16px;height:16px;stroke:#5c5650;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:4px}
.cal-day-hdr{text-align:center;font-size:10px;font-weight:600;color:#9a9088;padding:4px 0;text-transform:uppercase}
.cal-day{min-height:52px;background:#fff;border:1px solid var(--border);border-radius:var(--radius-sm);padding:4px;cursor:pointer;-webkit-user-select:none;transition:background .1s}
.cal-day:active{background:#f0ede8}
.cal-day.other-month{background:#fafaf8;opacity:.5}
.cal-day.today{border-color:var(--blue);border-width:2px}
.cal-day-num{font-size:12px;font-weight:600;color:#1c1a17;line-height:1}
.cal-day.today .cal-day-num{color:var(--blue)}
.cal-dots{display:flex;flex-wrap:wrap;gap:2px;margin-top:3px}
.cal-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.cal-legend{display:flex;gap:14px;margin-bottom:12px}
.cal-legend-item{display:flex;align-items:center;gap:5px;font-size:11px;color:#7a736a}
.cal-legend-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.inv-item-row{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid #f0ede8;cursor:pointer}
.inv-item-row:last-child{border-bottom:none}
.inv-item-row:active{background:#f8f6f3}
.inv-icon{width:38px;height:38px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:16px}
.inv-qty{font-size:18px;font-weight:700;color:#1c1a17;text-align:right;flex-shrink:0}
.inv-qty-lbl{font-size:10px;color:#9a9088}
.lead-status-bar{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px;margin-bottom:12px}
.lead-status-bar::-webkit-scrollbar{display:none}
.lead-stage{flex-shrink:0;background:#fff;border:1px solid var(--border);border-radius:var(--radius-sm);padding:6px 12px;font-size:12px;font-weight:600;color:#7a736a;cursor:pointer;-webkit-user-select:none}
.lead-stage.on{background:var(--blue);border-color:var(--blue);color:#fff}
.user-tile{display:flex;align-items:center;gap:11px;padding:12px 14px;border-bottom:1px solid #f0ede8;cursor:pointer}
.user-tile:last-child{border-bottom:none}
.user-tile:active{background:#f8f6f3}
.user-avatar-big{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:#fff;flex-shrink:0}
.report-loc-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:12px}
.report-loc-header{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.report-loc-swatch{width:38px;height:38px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;flex-shrink:0}
.report-loc-name{font-size:15px;font-weight:700;color:#1c1a17}
.report-loc-sub{font-size:12px;color:#9a9088;margin-top:1px}
.report-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
.report-stat{text-align:center;background:#f8f6f3;border-radius:var(--radius-sm);padding:8px 4px}
.report-stat-val{font-size:17px;font-weight:700;color:#1c1a17}
.report-stat-lbl{font-size:9px;color:#9a9088;text-transform:uppercase}
.report-bar-row{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.report-bar-label{font-size:11px;color:#5c5650;width:110px;flex-shrink:0}
.report-bar-bg{flex:1;height:6px;background:#f0ede8;border-radius:99px;overflow:hidden}
.report-bar-fill{height:100%;border-radius:99px;transition:width .4s}
.report-bar-count{font-size:11px;font-weight:600;color:#5c5650;width:20px;text-align:right;flex-shrink:0}
#login-screen{position:fixed;inset:0;background:#f5f3ef;z-index:1000;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:0;overflow-y:auto}
.login-header{width:100%;background:var(--blue);padding:40px 24px 28px;padding-top:calc(40px + env(safe-area-inset-top));text-align:center;flex-shrink:0}
.login-logo{width:56px;height:56px;border-radius:16px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;margin:0 auto 12px}
.login-logo svg{width:28px;height:28px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.login-title{font-size:20px;font-weight:800;color:#fff;margin-bottom:4px}
.login-sub{font-size:13px;color:rgba(255,255,255,.75)}
.login-body{width:100%;max-width:420px;padding:24px 16px;flex:1}
.user-select-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}
.user-select-card{background:#fff;border:1.5px solid var(--border);border-radius:var(--radius);padding:16px 12px;text-align:center;cursor:pointer;-webkit-user-select:none;transition:all .15s}
.user-select-card:active{transform:scale(.97)}
.user-select-card.active{border-color:var(--blue);background:var(--blue-light)}
.usc-avatar{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:#fff;margin:0 auto 8px}
.usc-name{font-size:14px;font-weight:700;color:#1c1a17;margin-bottom:3px}
.usc-role{font-size:11px;color:#9a9088}
.pin-section{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:20px 16px;margin-bottom:16px;display:none}
.pin-section.visible{display:block}
.pin-title{font-size:14px;font-weight:600;color:#5c5650;text-align:center;margin-bottom:14px}
.pin-dots{display:flex;justify-content:center;gap:12px;margin-bottom:20px}
.pin-dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--border);background:#fff;transition:all .15s}
.pin-dot.filled{background:var(--blue);border-color:var(--blue)}
.pin-dot.error{background:var(--red);border-color:var(--red)}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:260px;margin:0 auto}
.pin-key{height:52px;border-radius:var(--radius-sm);background:#f5f3ef;border:1px solid var(--border);font-size:20px;font-weight:600;color:#1c1a17;cursor:pointer;-webkit-user-select:none;display:flex;align-items:center;justify-content:center;transition:background .1s}
.pin-key:active{background:#e2ddd6}
.pin-key.del{font-size:14px;color:#7a736a}
.pin-key.empty{background:transparent;border-color:transparent;pointer-events:none}
.pin-error{color:var(--red);font-size:13px;text-align:center;margin-top:10px;font-weight:500;min-height:20px}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.pin-dots.shake{animation:shake .35s ease}
.more-menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.more-menu-item{display:flex;flex-direction:column;align-items:center;gap:7px;padding:16px 8px;background:#f8f6f3;border-radius:var(--radius);cursor:pointer;-webkit-user-select:none;transition:background .1s;border:1px solid var(--border)}
.more-menu-item:active{background:#eee}
.more-menu-icon{width:36px;height:36px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center}
.more-menu-icon svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.more-menu-label{font-size:12px;font-weight:600;color:#3c3830}
.my-work-card{background:#fff;border:1.5px solid var(--blue);border-radius:var(--radius);padding:14px;margin-bottom:12px}
.my-work-header{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.my-work-title{font-size:14px;font-weight:700;color:var(--blue)}
.client-hero{background:linear-gradient(135deg,var(--blue) 0%,var(--blue-dark) 100%);border-radius:var(--radius);padding:20px 16px;margin-bottom:12px;display:flex;align-items:center;gap:14px}
.client-hero-av{width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:#fff;flex-shrink:0}
.client-hero h2{font-size:18px;font-weight:700;color:#fff;margin-bottom:3px}
.client-hero p{font-size:13px;color:rgba(255,255,255,.8)}
.supplier-icon{width:38px;height:38px;border-radius:var(--radius-sm);background:var(--stone-light);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:16px}
/* ── NEW: INSCRIPTION CANVAS ── */
.inscription-canvas-wrap{border-radius:var(--radius-sm);overflow:hidden;background:#1a1a1a;position:relative;margin-top:10px}
.inscription-canvas-wrap canvas{width:100%;display:block;max-height:180px}
.inscription-canvas-label{position:absolute;top:6px;right:8px;font-size:9px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,.4)}
/* ── NEW: JOB COSTING DISPLAY ── */
.margin-display{background:var(--stone-light);border-radius:var(--radius-sm);padding:10px 12px;margin-top:8px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;text-align:center}
.margin-display .md-val{font-size:16px;font-weight:700}
.margin-display .md-lbl{font-size:10px;color:#9a9088;margin-top:1px}
.margin-good{color:var(--green)}
.margin-ok{color:var(--amber)}
.margin-bad{color:var(--red)}
/* ── NEW: PROOF WORKFLOW ── */
.proof-steps{display:flex;gap:4px;margin-bottom:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.proof-steps::-webkit-scrollbar{display:none}
.proof-step{flex:1;min-width:60px;text-align:center;padding:7px 4px;border-radius:var(--radius-sm);border:1px solid var(--border);background:#fafaf8;font-size:10px;font-weight:600;color:#9a9088;white-space:nowrap}
.proof-step.done{background:var(--green-light);border-color:#b8d8b8;color:var(--green)}
.proof-step.active{background:var(--blue-light);border-color:var(--blue);color:var(--blue)}
.proof-step.rejected{background:var(--red-light);border-color:#f0b8b8;color:var(--red)}
/* ── NEW: VETERAN BADGE ── */
.vet-badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;background:#1a3a6b;color:#d4af37;font-size:11px;font-weight:700;border:1px solid #d4af37}
/* ── NEW: CEMETERY DETAIL ── */
.cem-detail-header{background:linear-gradient(135deg,#2d5a27 0%,#1a3a15 100%);border-radius:var(--radius);padding:18px 16px;margin-bottom:12px;color:#fff}
.cem-detail-header h2{font-size:18px;font-weight:700;margin-bottom:4px}
.cem-detail-header p{font-size:13px;color:rgba(255,255,255,.8)}
/* ── NEW: PRICE BOOK ── */
.pb-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid #f0ede8;cursor:pointer}
.pb-item:last-child{border-bottom:none}
.pb-item:active{background:#f8f6f3}
.pb-icon{width:38px;height:38px;border-radius:var(--radius-sm);background:var(--stone-light);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.pb-price{font-size:17px;font-weight:700;color:var(--blue);text-align:right;flex-shrink:0}
.pb-price-lbl{font-size:10px;color:#9a9088}
/* ── NEW: AGING REPORT ── */
.aging-grid{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px;margin-bottom:14px}
.aging-bucket{background:#fff;border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 8px;text-align:center;cursor:pointer}
.aging-bucket:active{background:#f8f6f3}
.aging-bucket.has-items.over90{border-color:var(--red);background:var(--red-light)}
.aging-bucket.has-items.d60,.aging-bucket.has-items.d90{border-color:var(--amber);background:var(--amber-light)}
.aging-val{font-size:17px;font-weight:700;color:#1c1a17}
.aging-lbl{font-size:9px;color:#9a9088;margin-top:2px}
/* ── NEW: REVENUE PROJECTION BARS ── */
.proj-bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.proj-bar-month{font-size:12px;font-weight:600;color:#5c5650;width:52px;flex-shrink:0}
.proj-bar-track{flex:1;height:28px;background:#f0ede8;border-radius:var(--radius-sm);overflow:hidden;position:relative}
.proj-bar-fill{height:100%;border-radius:var(--radius-sm);transition:width .6s ease;display:flex;align-items:center;padding-left:8px;font-size:11px;font-weight:600;color:#fff;min-width:4px}
.proj-bar-amt{font-size:12px;font-weight:700;color:#5c5650;width:70px;text-align:right;flex-shrink:0}
/* ── NEW: QC CHECKLIST ── */
.check-item{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid #f0ede8;cursor:pointer;-webkit-user-select:none}
.check-item:last-child{border-bottom:none}
.check-item:active{background:#f8f6f3}
.check-box{width:22px;height:22px;border-radius:6px;border:2px solid var(--border);background:#fff;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .15s}
.check-box.checked{background:var(--green);border-color:var(--green)}
.check-box svg{width:13px;height:13px;stroke:#fff;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.check-label{font-size:13px;color:#1c1a17;flex:1}
.check-label.done{text-decoration:line-through;color:#9a9088}
/* ── NEW: COMM TEMPLATES ── */
.tpl-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:10px;cursor:pointer}
.tpl-card:active{background:#f8f6f3}
.tpl-category{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px}
.tpl-name{font-size:14px;font-weight:600;color:#1c1a17;margin-bottom:4px}
.tpl-preview{font-size:12px;color:#9a9088;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* ── NEW: STORAGE BADGE ── */
.storage-badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:99px;background:#f0ede8;color:#5c5650;font-size:11px;font-weight:600;border:1px solid var(--border)}
/* ── NEW: COMPANION LINK ── */
.companion-link{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:var(--radius-sm);background:var(--purple-light);border:1px solid #c4b5fd;margin-bottom:10px;cursor:pointer}
.companion-link:active{opacity:.8}
.companion-link p{font-size:12px;color:var(--purple);font-weight:600}
/* ── PRINT ── */
@media print{body *{visibility:hidden}#print-area,#print-area *{visibility:visible}#print-area{position:fixed;top:0;left:0;width:100%}}
/* ══════════ NEW FEATURES ══════════ */
/* AI Inscription Checker */
.ai-spinner{width:36px;height:36px;border:3px solid var(--blue-light);border-top-color:var(--blue);border-radius:50%;animation:ai-spin .8s linear infinite;margin:0 auto 14px}
@keyframes ai-spin{to{transform:rotate(360deg)}}
.ai-loading{text-align:center;padding:32px 20px;color:#5c5650;font-size:14px;line-height:1.5}
.ai-result-header{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:var(--radius-sm);margin-bottom:10px}
.ai-ok{background:var(--green-light);border:1px solid #b8d8b8}
.ai-warn{background:var(--amber-light);border:1px solid #e8c96a}
.ai-err{background:var(--red-light);border:1px solid #f0b8b8}
.ai-issue{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:var(--radius-sm);margin-bottom:8px;border:1px solid var(--border);background:#f8f6f3}
.ai-issue-error{background:var(--red-light)!important;border-color:#f0b8b8!important}
.ai-issue-warning{background:var(--amber-light)!important;border-color:#e8c96a!important}
.ai-issue-info{background:var(--blue-light)!important;border-color:#b8d0f0!important}
.ai-issue-icon{font-size:15px;flex-shrink:0;margin-top:1px}
.ai-issue-text{font-size:13px;line-height:1.5;color:#1c1a17}
.ai-setup-box{text-align:center;padding:20px 10px}
/* Cemetery compliance panel */
.compliance-panel{background:var(--amber-light);border:1px solid #e8c96a;border-radius:var(--radius-sm);padding:12px 14px;margin-top:8px;display:none}
.compliance-panel-header{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--amber);margin-bottom:8px}
.compliance-item{font-size:12px;color:#3c3830;line-height:1.5;padding:3px 0;display:flex;gap:7px;align-items:flex-start}
.compliance-warn-item{color:var(--red)!important;font-weight:600}
/* Calendar drag-drop chips */
.cal-day.drag-over{background:var(--blue-light)!important;outline:2px dashed var(--blue);outline-offset:-2px}
.cal-chip{background:var(--blue);color:#fff;font-size:10px;font-weight:600;border-radius:3px;padding:2px 5px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;cursor:grab;user-select:none;-webkit-user-select:none}
.cal-chip:active{cursor:grabbing;opacity:.7}
.cal-chip.due-chip{background:var(--amber)}
/* Payment link */
.plink-option{border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:8px;cursor:pointer;display:flex;align-items:center;gap:12px;background:#fff;transition:border-color .15s}
.plink-option:hover,.plink-option:active{border-color:var(--blue);background:var(--blue-light)}
.plink-option-icon{width:36px;height:36px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
/* Funeral home mode */
.fh-mode-banner{background:var(--purple-light);border:1px solid #c4b5fd;border-radius:var(--radius-sm);padding:10px 14px;margin-bottom:12px;font-size:13px;color:var(--purple);font-weight:500;line-height:1.4}
/* Status notification suggestion */
.notify-banner{display:flex;gap:10px;align-items:center;padding:12px 14px;background:var(--teal-light);border:1px solid #9dd3d3;border-radius:var(--radius-sm);margin-bottom:12px}
.notify-banner-icon{font-size:20px;flex-shrink:0}
.notify-banner-text{font-size:13px;color:var(--teal);font-weight:500;line-height:1.4}
</style>

<script>
// ═══════════════════════ CONSTANTS ═══════════════════════
const ORDER_STATUSES=['New Order','In Design','Proof Sent','Client Approved','In Production','In Finishing','Ready','Installing','Complete','On Hold','Cancelled'];
const STATUS_BADGE={
  'New Order':'b-blue','In Design':'b-purple','Proof Sent':'b-teal','Client Approved':'b-green',
  'In Production':'b-amber','In Finishing':'b-pink','Ready':'b-green','Installing':'b-teal',
  'Complete':'b-stone','On Hold':'b-amber','Cancelled':'b-red'
};
const PROOF_STATUSES=[
  {val:'none',lbl:'Not Started',cls:'b-stone'},
  {val:'draft',lbl:'Draft',cls:'b-blue'},
  {val:'sent',lbl:'Sent to Client',cls:'b-amber'},
  {val:'approved',lbl:'Approved ✓',cls:'b-green'},

function fmt(d){if(!d)return'—';const p=d.split('-');if(p.length<3)return d;return`${p[1]}/${p[2]}/${p[0]}`}
function dollar(n){return'$'+(Number(n)||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}
function esc(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function ago(ts){if(!ts)return'';const s=Math.floor((Date.now()-new Date(ts))/1000);if(s<60)return'just now';if(s<3600)return Math.floor(s/60)+'m ago';if(s<86400)return Math.floor(s/3600)+'h ago';return Math.floor(s/86400)+'d ago'}
function toast(msg,dur=2200){const el=document.getElementById('toast-el');el.textContent=msg;el.style.display='block';el.style.opacity='1';clearTimeout(el._t);el._t=setTimeout(()=>{el.style.opacity='0';setTimeout(()=>{el.style.display='none'},300)},dur)}
function daysUntil(d){if(!d)return null;const t=new Date(d+'T00:00:00').getTime()-new Date().setHours(0,0,0,0);return Math.ceil(t/86400000)}
function todayStr(){return new Date().toISOString().split('T')[0]}
function initials(name){if(!name)return'?';const p=name.trim().split(' ');return p.length>1?(p[0][0]+p[p.length-1][0]).toUpperCase():p[0].slice(0,2).toUpperCase()}

// ═══════════════════════ DATABASE ═══════════════════════
// Cache-first architecture:
// • All reads serve from in-memory cache (fast, works offline)
// • All writes update cache immediately + push to Supabase async
// • On login: pull fresh data from Supabase into cache
// • localStorage is the offline fallback when Supabase unreachable
const DB = {
  _c: {
    users:[], locations:[], clients:[], orders:[], invoices:[],
    leads:[], inventory:[], suppliers:[], cemeteries:[],
    pricebook:[], templates:[], activity:[], settings:{}

  // ── SYNC: pull everything from Supabase into cache ────────────
  async syncFromCloud() {
    if (!_supaConnected || !SUPA) return this._loadFromLocal();
    this._loadFromLocal(); // always load local first so we have fallback
    try {
      const [users, locs, clients, orders, invoices, leads, inv, sup, cems, pb, tpls, act, settings] = await Promise.all([
        SUPA.from('staff').select('*'),
        SUPA.from('locations').select('*'),
        SUPA.from('clients').select('*').order('last_name'),
        SUPA.from('orders').select('*').order('updated_at', {ascending:false}),
        SUPA.from('invoices').select('*').order('created_at', {ascending:false}),
        SUPA.from('leads').select('*').order('updated_at', {ascending:false}),
        SUPA.from('inventory').select('*'),
        SUPA.from('suppliers').select('*'),
        SUPA.from('cemeteries').select('*'),
        SUPA.from('price_book').select('*'),
        SUPA.from('comm_templates').select('*'),
        SUPA.from('activity_log').select('*').order('created_at', {ascending:false}).limit(500),
        SUPA.from('app_settings').select('*').eq('id',1).single()
      ]);
      // Merge strategy: Supabase wins for records it has,
      // but preserve any local-only records that failed to push (schema issues, offline, etc.)
      const merge = (supaData, localData) => {
        const supaIds = new Set((supaData||[]).map(r=>r.id));
        const localOnly = (localData||[]).filter(r=>!supaIds.has(r.id));
        if (localOnly.length) {
          console.warn(`Preserving ${localOnly.length} local-only record(s) not yet in Supabase — will retry push`);
          // retry pushing local-only records
          localOnly.forEach(r => setTimeout(()=>this._push(null,r),0));
        }
        return [...(supaData||[]), ...localOnly];
      };
      this._c.users      = users.data     || [];
      this._c.locations  = locs.data      || [];
      this._c.clients    = merge(clients.data,   this._c.clients);
      this._c.orders     = merge(orders.data,    this._c.orders);
      this._c.invoices   = merge(invoices.data,  this._c.invoices);
      this._c.leads      = merge(leads.data,     this._c.leads);
      this._c.inventory  = inv.data       || [];
      this._c.suppliers  = sup.data       || [];
      this._c.cemeteries = cems.data      || [];
      this._c.pricebook  = pb.data        || [];
      this._c.templates  = tpls.data      || [];
      this._c.activity   = act.data       || [];
      this._c.settings   = settings.data?.settings || {};
      this._saveToLocal();
      console.log('Synced from Supabase ✓');
    } catch(e) {
      console.warn('Cloud sync failed, using local data', e);
      this._loadFromLocal();
    }
  },

  // ── LOCAL STORAGE FALLBACK ─────────────────────────────────────
  _saveToLocal() {
    try {
      localStorage.setItem('ocm_cache', JSON.stringify(this._c));
    } catch(e) { console.warn('Local save failed', e); }
  },
  _loadFromLocal() {
    try {
      const saved = localStorage.getItem('ocm_cache');
      if (saved) { const d = JSON.parse(saved); Object.assign(this._c, d); }
    } catch(e) {}
  },

  // ── GENERIC PUSH TO SUPABASE ───────────────────────────────────
  _tableFor(row) {
    // Infer table from record shape when table name isn't passed
    if (row.order_number !== undefined) return 'orders';
    if (row.last_name !== undefined && row.order_number === undefined) return 'clients';
    if (row.inv_number !== undefined) return 'invoices';
    if (row.stage !== undefined) return 'leads';
    return null;
  },
  async _push(table, row) {
    if (!_supaConnected || !SUPA) return;
    const tbl = table || this._tableFor(row);
    if (!tbl) return;
    try {
      // Strip any fields that might not exist in Supabase schema yet
      const safe = {...row};
      const { error } = await SUPA.from(tbl).upsert(safe);
      if (error) {
        console.error(`Push error [${tbl}]:`, error.message);
        // Surface schema errors so they're visible
        if (error.message?.includes('column') || error.code === '42703') {
          console.warn('Schema mismatch — some fields may not exist in Supabase yet. Data is saved locally.');
          // Try again with minimal safe fields only
          const minimal = {id: row.id, updated_at: row.updated_at || new Date().toISOString()};
          if (row.order_number !== undefined) { minimal.order_number=row.order_number; minimal.status=row.status; minimal.client_id=row.client_id; minimal.inscription=row.inscription; minimal.price=row.price; minimal.install_date=row.install_date; }
          if (row.last_name !== undefined) { minimal.first_name=row.first_name; minimal.last_name=row.last_name; minimal.phone=row.phone; minimal.email=row.email; }
          const { error: e2 } = await SUPA.from(tbl).upsert(minimal);
          if (e2) console.error(`Minimal push also failed [${tbl}]:`, e2.message);
          else console.log(`Minimal push succeeded [${tbl}] — run Supabase migration to add new columns`);
        }
      }
    } catch(e) { console.warn(`Push failed [${tbl}]`, e); }
  },
  async _delete(table, id) {
    if (!_supaConnected || !SUPA) return;
    try {
      const { error } = await SUPA.from(table).delete().eq('id', id);
      if (error) console.error(`Delete error [${table}]:`, error.message);
    } catch(e) { console.warn(`Delete failed [${table}]`, e); }
  },

      return new Promise(resolve => {
        const reader = new FileReader();

      this.saveUser({id:'user_manager',name:'Manager',role:'manager',pin:'1234',location_id:null,email:'',phone:'',active:true,created_at:now()});
    }
  },

    if (!this._c.templates.length) {
      const tpls = [
        {id:uid(),name:'Proof Ready for Review',category:'Proof',body:'Hi {client_name},\n\nYour proof for Order #{order_number} is ready for review. Please contact us at your earliest convenience to approve the inscription and design.\n\nWe cannot begin production until we receive your written approval.\n\nThank you,\n{company_name}'},
        {id:uid(),name:'Installation Scheduled',category:'Installation',body:'Hi {client_name},\n\nWe wanted to let you know that the installation for Order #{order_number} is scheduled for {install_date}.\n\nThank you,\n{company_name}'},
        {id:uid(),name:'Balance Due Reminder',category:'Payment',body:'Hi {client_name},\n\nThis is a friendly reminder that a balance of {balance_due} remains on Order #{order_number}.\n\nThank you,\n{company_name}'},

      ];

    }
  },
  exportAll() {
    const data = {users:this._c.users,locations:this._c.locations,clients:this._c.clients,orders:this._c.orders,invoices:this._c.invoices,leads:this._c.leads,inventory:this._c.inventory,suppliers:this._c.suppliers,cemeteries:this._c.cemeteries,pricebook:this._c.pricebook,templates:this._c.templates,activity:this._c.activity,settings:this._c.settings,exported_at:now(),version:4};
    const blob = new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
    const a = document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`ocm-backup-${todayStr()}.json`; a.click();
  },
  importAll(json) {
    const d = JSON.parse(json);
    if(d.locations)  this._c.locations  = d.locations;
    if(d.clients)    this._c.clients    = d.clients;
    if(d.orders)     this._c.orders     = d.orders;
    if(d.invoices)   this._c.invoices   = d.invoices;
    if(d.leads)      this._c.leads      = d.leads;
    if(d.inventory)  this._c.inventory  = d.inventory;
    if(d.suppliers)  this._c.suppliers  = d.suppliers;
    if(d.cemeteries) this._c.cemeteries = d.cemeteries;
    if(d.pricebook)  this._c.pricebook  = d.pricebook;
    if(d.templates)  this._c.templates  = d.templates;
    if(d.activity)   this._c.activity   = d.activity;
    if(d.users)      this._c.users      = d.users;
    if(d.settings)   this._c.settings   = d.settings;
    this._saveToLocal();
  }
};

function selectUser(id){
  _loginUserId=id;_pinBuf='';
  document.querySelectorAll('.user-select-card').forEach(c=>c.classList.remove('active'));
  document.getElementById('usc-'+id)?.classList.add('active');
  const u=DB.getUser(id);
  document.getElementById('pin-section-title').textContent=`Enter PIN for ${u?.name||'user'}`;

function pinKey(k){if(_pinBuf.length>=4)return;_pinBuf+=k;updatePinDots();if(_pinBuf.length===4)setTimeout(checkPin,80);}
function pinBackspace(){_pinBuf=_pinBuf.slice(0,-1);updatePinDots();}
function updatePinDots(){for(let i=0;i<4;i++){const d=document.getElementById('pd'+i);if(d){d.classList.toggle('filled',i<_pinBuf.length);d.classList.remove('error');}}}
function checkPin(){
  const u=DB.getUser(_loginUserId);
  if(u&&u.pin===_pinBuf){AUTH.login(_loginUserId);bootApp();}
  else{
    const dots=document.getElementById('pin-dots');
    document.querySelectorAll('.pin-dot').forEach(d=>{d.classList.add('error');d.classList.remove('filled');});
    dots.classList.add('shake');
    document.getElementById('pin-error').textContent='Incorrect PIN';
    setTimeout(()=>{dots.classList.remove('shake');_pinBuf='';updatePinDots();document.getElementById('pin-error').textContent='';},600);
  }
}
function cancelLogin(){_loginUserId=null;_pinBuf='';document.getElementById('pin-section').classList.remove('visible');document.querySelectorAll('.user-select-card').forEach(c=>c.classList.remove('active'));}

// ═══════════════════════ ORDERS ═══════════════════════
function filterOrders(){
  let orders=DB.getOrders().filter(o=>!curLoc||o.location_id===curLoc);
  if(curOrderFilter==='active')orders=orders.filter(o=>!['Complete','Cancelled'].includes(o.status));
  else if(curOrderFilter==='ready')orders=orders.filter(o=>o.status==='Ready');
  else if(curOrderFilter==='proof')orders=orders.filter(o=>o.proof_status==='sent');
  else if(curOrderFilter==='veteran')orders=orders.filter(o=>o.is_veteran);
  else if(curOrderFilter!=='all')orders=orders.filter(o=>o.status===curOrderFilter);
  return orders.sort((a,b)=>b.updated_at?.localeCompare(a.updated_at||'')||0);
}

function drawInscriptionCanvas(text,canvasId){
  const canvas=document.getElementById(canvasId);if(!canvas)return;
  const ctx=canvas.getContext('2d');
  const w=640,h=200;canvas.width=w;canvas.height=h;
  ctx.fillStyle='#252525';ctx.fillRect(0,0,w,h);
  for(let i=0;i<300;i++){const x=Math.random()*w,y=Math.random()*h;ctx.strokeStyle=`rgba(255,255,255,${0.02+Math.random()*0.05})`;ctx.lineWidth=0.5;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+Math.random()*20-10,y+Math.random()*40);ctx.stroke();}
  ctx.strokeStyle='rgba(255,255,255,0.12)';ctx.lineWidth=1.5;ctx.strokeRect(18,14,w-36,h-28);
  const lines=text.split('\n').filter(l=>l.trim());if(!lines.length)return;
  ctx.fillStyle='#ddd5c0';ctx.textAlign='center';ctx.shadowColor='rgba(0,0,0,0.8)';ctx.shadowBlur=3;ctx.shadowOffsetY=1;
  const fs=lines.length<=2?28:lines.length<=4?22:17;const lh=fs*1.55;
  const startY=h/2-(lines.length*lh/2)+fs*0.85;
  lines.forEach((line,i)=>{
    if(i===0){ctx.font=`bold ${fs}px Georgia,serif`;}
    else if(/^\d{4}/.test(line.trim())){ctx.font=`${fs-4}px Georgia,serif`;}
    else{ctx.font=`italic ${fs-2}px Georgia,serif`;}
    const spaced=line.toUpperCase().split('').join('\u200A\u200A');
    ctx.fillText(spaced,w/2,startY+i*lh);
  });
}

  try {
    const context = [firstName||lastName?`Decedent: ${firstName} ${lastName}`:'', dob?`Date of Birth: ${dob}`:'', dod?`Date of Death: ${dod}`:''].filter(Boolean).join('\n');

Inscription:
${inscription}

Check for: (1) Date math errors — death before birth, impossible ages, future dates; (2) Spelling — flag names that look misspelled; (3) Date format inconsistencies; (4) Age vs. year mismatch; (5) Wrong pronouns or contradictory relationship terms; (6) Missing critical info when other info is present.

Return ONLY a JSON object with no markdown or preamble:
{"status":"ok"|"warnings"|"errors","summary":"1 sentence","issues":[{"severity":"error"|"warning"|"info","message":"clear plain-English description"}]}`;
    const resp = await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01'},body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:800,messages:[{role:'user',content:prompt}]})});

// ═══════════════════════ CEMETERY COMPLIANCE ═══════════════════════
function onCemeterySelect(cemId) {
  const panel = document.getElementById('cem-compliance-panel');
  if (!panel) return;
  if (!cemId) { panel.style.display = 'none'; return; }
  const cem = DB.getCemetery(cemId);
  if (!cem) { panel.style.display = 'none'; return; }
  let html = '';
  if (cem.permit_required) html += `<div class="compliance-item compliance-warn-item">⚠️ <strong>Permit Required</strong>${cem.permit_fee?` — Fee: $${cem.permit_fee}`:''}${cem.permit_contact?' · Contact: '+esc(cem.permit_contact):''}</div>`;
  if (cem.access_hours) html += `<div class="compliance-item"><span>🕐</span><span><strong>Access Hours:</strong> ${esc(cem.access_hours)}</span></div>`;
  if (cem.installation_rules) html += `<div class="compliance-item"><span>📋</span><span><strong>Install Rules:</strong> ${esc(cem.installation_rules)}</span></div>`;
  if (cem.section_lot_format) html += `<div class="compliance-item"><span>🗺</span><span><strong>Lot Format:</strong> ${esc(cem.section_lot_format)}</span></div>`;
  if (cem.contact_name) html += `<div class="compliance-item"><span>📞</span><span><strong>Contact:</strong> ${esc(cem.contact_name)}${cem.phone?' · '+esc(cem.phone):''}</span></div>`;
  if (!html) html = `<div class="compliance-item"><span>✅</span><span style="color:#9a9088">No specific rules on record for this cemetery.</span></div>`;
  panel.innerHTML = `<div class="compliance-panel-header">📍 ${esc(cem.name)} Requirements</div>${html}`;
  panel.style.display = 'block';
}

rder-radius:8px;padding:11px;font-size:13px;font-weight:600;width:100%;cursor:pointer}.conf{display:none;border-radius:12px;padding:20px;text-align:center;margin-bottom:12px}.conf-ok{background:#e6f3e6;border:2px solid #b8d8b8}.conf-rev{background:#fdeaea;border:2px solid #f0b8b8}.conf-icon{font-size:44px;margin-bottom:10px}.conf h2{font-size:16px;font-weight:700}.conf p{font-size:13px;margin-top:6px;line-height:1.5}.mailto-btn{display:block;margin-top:12px;color:#fff;text-align:center;padding:10px;border-radius:7px;font-size:13px;font-weight:600;text-decoration:none;background:#1a5fb4}.footer{text-align:center;font-size:11px;color:#9a9088;padding:12px 0;line-height:1.6}</style>

function copyToClip(text) {

}

function saveFHOrder() {
  const decFirst = document.getElementById('fh-dec-first')?.value.trim();

  }

// ═══════════════════════ STATUS NOTIFICATION SUGGESTION ═══════════════════════
function suggestStatusNotification(orderId, newStatus, oldStatus) {
  if (!oldStatus || newStatus === oldStatus) return;
  const notifyStatuses = ['Proof Sent','Client Approved','In Production','Ready','Installing','Complete'];
  if (!notifyStatuses.includes(newStatus)) return;
  const o = DB.getOrder(orderId); if (!o) return;
  const c = o.client_id ? DB.getClient(o.client_id) : null;
  if (!c || (!c.email && !c.phone)) return;
  const templates = DB.getTemplates();
  let tpl = null;
  if (newStatus==='Proof Sent') tpl=templates.find(t=>t.name?.toLowerCase().includes('proof'));
  else if (['Complete','Ready'].includes(newStatus)) tpl=templates.find(t=>t.name?.toLowerCase().includes('ready')||t.name?.toLowerCase().includes('complete')||t.name?.toLowerCase().includes('pickup'));
  else if (newStatus==='Installing') tpl=templates.find(t=>t.name?.toLowerCase().includes('install'));
  const s = DB.getSettings();
  const filledBody = tpl ? fillTemplate(tpl.body,o,c,s) : null;
  setTimeout(()=>{
    document.getElementById('dp').innerHTML = `<div class="overlay" onclick="if(event.target===this)closeDrawer()"><div class="drawer">
      <div class="dhandle"></div><div class="dtitle">📬 Notify Client?</div>
      <div class="notify-banner"><div class="notify-banner-icon">🔔</div><div class="notify-banner-text">Status changed to <strong>${esc(newStatus)}</strong> — Want to let ${c.first_name} know?</div></div>
      ${filledBody?`<div class="fsec" style="padding:12px"><div class="fsec-title">Suggested Message</div><pre style="font-size:12px;white-space:pre-wrap;color:#3c3830;line-height:1.6;max-height:160px;overflow:auto">${esc(filledBody)}</pre></div>`:''}
      <div class="btn-row" style="margin-top:14px">
        <button class="btn btn-ghost" onclick="closeDrawer()">Skip</button>
        ${c.email?`<button class="btn btn-primary" onclick="${filledBody?`window.open('mailto:${c.email}?subject=Order+%23${o.order_number}&body='+encodeURIComponent(${JSON.stringify(filledBody)}),'_blank')`:``};toast('Email opened');closeDrawer()">📧 Email</button>`:''}
        ${c.phone?`<a class="btn btn-teal" href="sms:${c.phone}${filledBody?'?body='+encodeURIComponent(filledBody):''}">💬 Text</a>`:''}
      </div>
    </div></div>`;
  }, 350);
}
function fillTemplate(body,o,c,s){
  if(!body)return '';
  return body.replace(/\{client_name\}/g,c?`${c.first_name} ${c.last_name}`:'').replace(/\{first_name\}/g,c?.first_name||'').replace(/\{order_number\}/g,o?.order_number||'').replace(/\{install_date\}/g,o?.install_date?fmt(o.install_date):'TBD').replace(/\{balance_due\}/g,o?dollar(Number(o.price||0)-Number(o.deposit_paid||0)):'').replace(/\{company_name\}/g,s?.company_name||'Oswego County Monument').replace(/\{monument_type\}/g,o?.monument_type||'monument');
}

function updatePriceCalc(){

  const optsList=document.getElementById('pc-opts-list');

  optWrap.style.display='block';

function calcPriceTotal(){
  const id=document.getElementById('pc-item')?.value;
  const item=id?DB.getPriceBookItem(id):null;
  if(!item)return;
  let total=Number(item.base_price||0);
  const opts=item.options||[];
  opts.forEach((_,i)=>{total+=Number(document.getElementById(`pc-opt-${i}`)?.value||0);});
  const chars=Number(document.getElementById('pc-chars')?.value||0);
  const charRate=Number(document.getElementById('pc-char-rate')?.value||0);
  total+=chars*charRate;
  const el=document.getElementById('pc-total');
  if(el)el.textContent=dollar(total);
  return total;
}

function renderCalendar(){
  const orders=DB.getOrders().filter(o=>!curLoc||o.location_id===curLoc);
  const year=calYear,month=calMonth;
  const first=new Date(year,month,1);
  const last=new Date(year,month+1,0);
  const startDay=first.getDay();
  const today=new Date();
  const todayY=today.getFullYear(),todayM=today.getMonth(),todayD=today.getDate();
  const installMap={},dueMap={};
  orders.forEach(o=>{
    if(o.install_date){if(!installMap[o.install_date])installMap[o.install_date]=[];installMap[o.install_date].push(o);}
    if(o.due_date){if(!dueMap[o.due_date])dueMap[o.due_date]=[];dueMap[o.due_date].push(o);}
  });
  let cells='';
  const totalCells=Math.ceil((startDay+last.getDate())/7)*7;
  for(let i=0;i<totalCells;i++){
    const dayNum=i-startDay+1;
    const isOther=dayNum<1||dayNum>last.getDate();
    const isToday=!isOther&&year===todayY&&month===todayM&&dayNum===todayD;
    const dateStr=isOther?null:`${year}-${String(month+1).padStart(2,'0')}-${String(dayNum).padStart(2,'0')}`;
    const installs=dateStr&&installMap[dateStr]?installMap[dateStr]:[];
    const dues=dateStr&&dueMap[dateStr]?dueMap[dateStr]:[];
    const hasItems=installs.length+dues.length;
    const extra=hasItems>4?hasItems-4:0;
    cells+=`<div class="cal-day${isOther?' other-month':''}${isToday?' today':''}"
      ${dateStr&&hasItems?`onclick="showCalDay('${dateStr}')"`:''}
      ${dateStr?`ondragover="event.preventDefault();this.classList.add('drag-over')" ondragleave="this.classList.remove('drag-over')" ondrop="dropOnCalDay('${dateStr}',event)"`:''}>
      <div class="cal-day-num">${isOther?'':dayNum}</div>
      ${installs.slice(0,2).map(o=>{const c=DB.getClient(o.client_id);const nm=c?c.last_name:'#'+o.order_number;return`<div class="cal-chip" draggable="true" ondragstart="calDragStart('${o.id}','install_date',event)" onclick="event.stopPropagation();showOrderDetail('${o.id}')" title="${c?c.first_name+' '+c.last_name:'Order #'+o.order_number}">${esc(nm)}</div>`;}).join('')}
      ${dues.slice(0,Math.max(0,2-installs.length)).map(o=>{const c=DB.getClient(o.client_id);const nm=c?c.last_name:'#'+o.order_number;return`<div class="cal-chip due-chip" draggable="true" ondragstart="calDragStart('${o.id}','due_date',event)" onclick="event.stopPropagation();showOrderDetail('${o.id}')" title="${c?c.first_name+' '+c.last_name:'Order #'+o.order_number} (due)">${esc(nm)}</div>`;}).join('')}
      ${extra?`<div style="font-size:9px;color:#9a9088;text-align:center;padding:1px 0">+${extra} more</div>`:''}
    </div>`;
  }
  const monthNames=['January','February','March','April','May','June','July','August','September','October','November','December'];
  const thisMonthInstalls=orders.filter(o=>o.install_date&&o.install_date.startsWith(`${year}-${String(month+1).padStart(2,'0')}`));
  document.getElementById('pg-calendar').innerHTML=`
  <div class="cal-nav">
    <button class="cal-nav-btn" onclick="calMonth--;if(calMonth<0){calMonth=11;calYear--;}renderCalendar()"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg></button>
    <h2>${monthNames[month]} ${year}</h2>
    <button class="cal-nav-btn" onclick="calMonth++;if(calMonth>11){calMonth=0;calYear++;}renderCalendar()"><svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></button>
  </div>

function getAgingBuckets(invs){
  const today=new Date();today.setHours(0,0,0,0);
  const buckets={current:[],d30:[],d60:[],d90:[],over90:[]};
  invs.filter(i=>i.status!=='Paid').forEach(inv=>{
    const due=inv.due_date?new Date(inv.due_date+'T00:00:00'):null;
    if(!due||due>=today){buckets.current.push(inv);return;}
    const days=Math.floor((today-due)/86400000);
    if(days<=30)buckets.d30.push(inv);
    else if(days<=60)buckets.d60.push(inv);
    else if(days<=90)buckets.d90.push(inv);
    else buckets.over90.push(inv);
  });
  return buckets;
}
function bucketTotal(arr){return arr.reduce((s,i)=>s+Number(i.amount||0)-Number(i.paid||0),0);}

let _pbOptCount=0;
function addPBOption(){
  _pbOptCount++;

  const div=document.createElement('div');
  div.style.cssText='background:#f8f6f3;border-radius:var(--radius-sm);padding:10px;margin-bottom:8px';
  div.id=`pbf-opt-${oi}`;
  div.innerHTML=`<div class="frow" style="margin-bottom:6px"><div class="field"><label>Option Group Name</label><input type="text" id="pbf-opt-name-${oi}" placeholder="e.g. Size, Finish"></div><div style="display:flex;align-items:flex-end"><button class="btn btn-danger" style="padding:8px 10px;font-size:12px" onclick="this.parentElement.parentElement.parentElement.remove()">Remove</button></div></div><div id="pbf-choices-${oi}"></div><button class="btn btn-ghost" style="font-size:12px;margin-top:4px" onclick="addPBChoice(${oi})">+ Add Choice</button>`;

}
function addPBChoice(oi){
  const cont=document.getElementById(`pbf-choices-${oi}`);if(!cont)return;
  const ci=cont.children.length;
  const div=document.createElement('div');div.className='frow';div.style.marginBottom='4px';
  div.innerHTML=`<div class="field"><input type="text" id="pbf-ch-lbl-${oi}-${ci}" placeholder="Choice label"></div><div class="field"><input type="number" id="pbf-ch-adj-${oi}-${ci}" value="0" step="0.01" placeholder="Price adj"></div>`;
  cont.appendChild(div);
}
function removePBOption(oi){document.getElementById(`pbf-opt-${oi}`)?.remove();}
function savePriceBookItem(id,isNew){
  const item=isNew?{id,active:true}:DB.getPriceBookItem(id)||{id,active:true};
  item.name=document.getElementById('pbf-name').value.trim();
  item.category=document.getElementById('pbf-cat').value;
  item.base_price=Number(document.getElementById('pbf-price').value||0);
  item.lettering_cost_per_char=Number(document.getElementById('pbf-char-rate').value||3.50);
  item.material=document.getElementById('pbf-material').value.trim();
  item.emoji=document.getElementById('pbf-emoji').value.trim()||'🪨';
  item.notes=document.getElementById('pbf-notes').value.trim();
  // Collect options
  item.options=[];
  const optDivs=document.querySelectorAll('[id^="pbf-opt-"]');
  optDivs.forEach((div,oi)=>{
    const nameEl=div.querySelector(`[id^="pbf-opt-name-"]`);
    if(!nameEl)return;
    const name=nameEl.value.trim();if(!name)return;
    const choices=[];const choiceEls=div.querySelectorAll('[id^="pbf-ch-lbl-"]');
    choiceEls.forEach(el=>{const suffix=el.id.replace('pbf-ch-lbl-','');const adjEl=document.getElementById('pbf-ch-adj-'+suffix);if(el.value.trim())choices.push({label:el.value.trim(),price_adj:Number(adjEl?.value||0)});});
    item.options.push({name,choices});
  });
  if(!item.name){toast('Name required');return;}
  DB.savePriceBookItem(item);toast(isNew?'Item added':'Item updated');closeDrawer();renderPriceBook();
}

function convertLeadToOrder(leadId){
  const l=DB.getLead(leadId);if(!l)return;
  // Try to find/create client
  let clientId='';
  const existing=DB.getClients().find(c=>c.phone===l.phone||c.email===l.email);
  if(existing){clientId=existing.id;}
  else if(l.first_name||l.last_name){
    const nc={id:uid(),first_name:l.first_name||'',last_name:l.last_name||'',phone:l.phone||'',email:l.email||'',address:'',notes:`Converted from lead`,created_at:now()};
    DB.saveClient(nc);clientId=nc.id;
  }
  l.stage='Won';DB.saveLead(l);
  closeDrawer();showOrderForm(null);
  setTimeout(()=>{
    const sel=document.getElementById('of-client');
    if(sel&&clientId){sel.value=clientId;}
  },200);
  toast('Lead converted — fill in order details');
}

function renderReports(){
  if(!AUTH.isManager()){document.getElementById('pg-reports').innerHTML='<div class="empty"><h3>Manager access required</h3></div>';return;}
  const orders=DB.getOrders().filter(o=>!curLoc||o.location_id===curLoc);
  const locs=DB.getLocations();
  const now_d=new Date();
  const thisYear=now_d.getFullYear();

  // Revenue by month (last 6)
  const months=[];
  for(let i=5;i>=0;i--){const d=new Date(thisYear,now_d.getMonth()-i,1);months.push({year:d.getFullYear(),month:d.getMonth(),label:d.toLocaleString('en',{month:'short',year:'2-digit'}),revenue:0,count:0});}
  orders.filter(o=>o.status==='Complete'&&o.updated_at).forEach(o=>{
    const d=new Date(o.updated_at);const idx=months.findIndex(m=>m.year===d.getFullYear()&&m.month===d.getMonth());
    if(idx>=0){months[idx].revenue+=Number(o.price||0);months[idx].count++;}
  });
  const maxRev=Math.max(...months.map(m=>m.revenue),1);

  // Revenue projection (next 3 months)
  const proj=[];
  for(let i=0;i<3;i++){const d=new Date(thisYear,now_d.getMonth()+i,1);proj.push({year:d.getFullYear(),month:d.getMonth(),label:d.toLocaleString('en',{month:'short',year:'2-digit'}),expected:0,confirmed:0});}
  orders.filter(o=>!['Complete','Cancelled'].includes(o.status)&&o.install_date).forEach(o=>{
    const d=new Date(o.install_date+'T00:00:00');const idx=proj.findIndex(m=>m.year===d.getFullYear()&&m.month===d.getMonth());
    if(idx>=0){const bal=Number(o.price||0)-Number(o.deposit_paid||0);proj[idx].expected+=bal;if(o.status==='Ready')proj[idx].confirmed+=bal;}
  });
  const maxProj=Math.max(...proj.map(m=>m.expected),1);

  // Job costing summary
  const costOrders=orders.filter(o=>o.material_cost||o.labor_hours);
  const lhr=Number(DB.getSetting('labor_rate',45));
  const totRev=costOrders.reduce((s,o)=>s+Number(o.price||0),0);
  const totCOGS=costOrders.reduce((s,o)=>s+Number(o.material_cost||0)+Number(o.labor_hours||0)*lhr,0);
  const totGP=totRev-totCOGS;
  const avgMargin=totRev>0?(totGP/totRev*100).toFixed(1):'—';

  // Order status breakdown
  const statusCounts={};ORDER_STATUSES.forEach(s=>{statusCounts[s]=orders.filter(o=>o.status===s).length;});
  const maxStatus=Math.max(...Object.values(statusCounts),1);

  // Location breakdown
  const locData=locs.map(l=>{
    const lo=orders.filter(o=>o.location_id===l.id);
    return{...l,total:lo.length,active:lo.filter(o=>!['Complete','Cancelled'].includes(o.status)).length,revenue:lo.filter(o=>o.status==='Complete').reduce((s,o)=>s+Number(o.price||0),0)};
  });

  // Lead pipeline
  const leads=DB.getLeads();
  const wonLeads=leads.filter(l=>l.stage==='Won').length;
  const convRate=leads.length>0?(wonLeads/leads.length*100).toFixed(0):0;

  document.getElementById('pg-reports').innerHTML=`
  <!-- Overview -->
  <div class="metrics-3">
    <div class="qstat"><div class="qstat-val">${orders.length}</div><div class="qstat-lbl">Total Orders</div></div>
    <div class="qstat"><div class="qstat-val">${orders.filter(o=>o.status==='Complete').length}</div><div class="qstat-lbl">Complete</div></div>
    <div class="qstat"><div class="qstat-val">${dollar(orders.filter(o=>o.status==='Complete').reduce((s,o)=>s+Number(o.price||0),0))}</div><div class="qstat-lbl">Total Revenue</div></div>
  </div>

  <!-- Revenue by Month -->
  <div class="section-label">Revenue (Last 6 Months — Completed Orders)</div>
  <div class="card" style="padding:14px">
    ${months.map(m=>`<div class="proj-bar-row">
      <div class="proj-bar-month">${m.label}</div>
      <div class="proj-bar-track">
        <div class="proj-bar-fill" style="width:${m.revenue/maxRev*100}%;background:var(--blue)"></div>
      </div>
      <div class="proj-bar-amt">${dollar(m.revenue)}</div>
    </div>`).join('')}
  </div>

  <!-- Revenue Projection -->
  <div class="section-label">Revenue Projection (Next 3 Months — Pending Installs)</div>
  <div class="card" style="padding:14px">
    ${proj.map(m=>`<div class="proj-bar-row">
      <div class="proj-bar-month">${m.label}</div>
      <div class="proj-bar-track">
        <div class="proj-bar-fill" style="width:${m.expected/maxProj*100}%;background:var(--teal)">
          ${m.confirmed>0?`<span style="font-size:9px">✓${dollar(m.confirmed)}</span>`:''}
        </div>
      </div>
      <div class="proj-bar-amt">${dollar(m.expected)}</div>
    </div>`).join('')}
    <p style="font-size:11px;color:#9a9088;margin-top:6px">Balance remaining on orders with upcoming install dates. ✓ = Ready status.</p>
  </div>

  <!-- Job Costing Summary -->
  ${costOrders.length?`
  <div class="section-label">Job Costing Summary (${costOrders.length} Orders)</div>
  <div class="card" style="padding:14px">
    <div class="report-stats">
      <div class="report-stat"><div class="report-stat-val">${dollar(totRev)}</div><div class="report-stat-lbl">Revenue</div></div>
      <div class="report-stat"><div class="report-stat-val">${dollar(totCOGS)}</div><div class="report-stat-lbl">COGS</div></div>
      <div class="report-stat"><div class="report-stat-val" style="color:${totGP>=0?'var(--green)':'var(--red)'}">${dollar(totGP)}</div><div class="report-stat-lbl">Gross Profit</div></div>
      <div class="report-stat"><div class="report-stat-val" style="color:${Number(avgMargin)>=30?'var(--green)':Number(avgMargin)>=0?'var(--amber)':'var(--red)'}">${avgMargin}%</div><div class="report-stat-lbl">Avg Margin</div></div>
    </div>
  </div>`:''}

  <!-- Order Status -->
  <div class="section-label">Order Status Breakdown</div>
  <div class="card" style="padding:14px">
    ${ORDER_STATUSES.filter(s=>statusCounts[s]>0).map(s=>`<div class="report-bar-row">
      <div class="report-bar-label" style="font-size:11px">${s}</div>
      <div class="report-bar-bg"><div class="report-bar-fill" style="background:${statusCounts[s]>0?`var(--${STATUS_BADGE[s]?.replace('b-','')?.split('|')[0]||'blue'})`.replace(/[()]/g,''):'#f0ede8'};width:${statusCounts[s]/maxStatus*100}%"></div></div>
      <div class="report-bar-count">${statusCounts[s]}</div>
    </div>`).join('')}
  </div>

  <!-- Location Performance -->
  ${locData.length>1?`
  <div class="section-label">Location Performance</div>
  ${locData.map(l=>`<div class="report-loc-card">
    <div class="report-loc-header">
      <div class="report-loc-swatch" style="background:${l.color||'#1a5fb4'}">${l.initials||initials(l.name)}</div>
      <div><div class="report-loc-name">${esc(l.name)}</div><div class="report-loc-sub">${l.address||''}</div></div>
    </div>
    <div class="report-stats">
      <div class="report-stat"><div class="report-stat-val">${l.total}</div><div class="report-stat-lbl">Orders</div></div>
      <div class="report-stat"><div class="report-stat-val">${l.active}</div><div class="report-stat-lbl">Active</div></div>
      <div class="report-stat" style="grid-column:span 2"><div class="report-stat-val">${dollar(l.revenue)}</div><div class="report-stat-lbl">Revenue</div></div>
    </div>
  </div>`).join('')}`:''}

  <!-- Lead Pipeline -->
  <div class="section-label">Lead Pipeline</div>
  <div class="card" style="padding:14px">
    <div class="report-stats">
      <div class="report-stat"><div class="report-stat-val">${leads.length}</div><div class="report-stat-lbl">Total</div></div>
      <div class="report-stat"><div class="report-stat-val">${leads.filter(l=>!['Won','Lost','Archived'].includes(l.stage)).length}</div><div class="report-stat-lbl">Active</div></div>
      <div class="report-stat"><div class="report-stat-val">${wonLeads}</div><div class="report-stat-lbl">Won</div></div>
      <div class="report-stat"><div class="report-stat-val" style="color:var(--green)">${convRate}%</div><div class="report-stat-lbl">Conv. Rate</div></div>
    </div>
  </div>

  <button class="btn btn-ghost btn-full" onclick="DB.exportAll();toast('Backup exported!')">💾 Export Full Backup</button>`;
}

function previewFilledTemplate(tplId,orderId){
  const t=DB.getTemplate(tplId);const o=DB.getOrder(orderId);
  if(!t||!o)return;
  const c=o.client_id?DB.getClient(o.client_id):null;
  const settings=DB.getSettings();
  let body=t.body||'';
  body=body.replace(/{client_name}/g,c?c.first_name+' '+c.last_name:'Customer');
  body=body.replace(/{order_number}/g,o.order_number||'—');
  body=body.replace(/{install_date}/g,o.install_date?fmt(o.install_date):'TBD');
  body=body.replace(/{balance_due}/g,dollar(Number(o.price||0)-Number(o.deposit_paid||0)));
  body=body.replace(/{company_name}/g,settings.company_name||'Oswego County Monument');
  body=body.replace(/{monument_type}/g,o.monument_type||'monument');
  const wrap=document.getElementById('tpl-filled-preview');
  const pre=document.getElementById('tpl-filled-text');
  if(wrap&&pre){pre.textContent=body;wrap.style.display='block';}
  window._tplFilledText=body;
}
function copyTemplate(){
  if(!window._tplFilledText)return;
  if(navigator.clipboard){navigator.clipboard.writeText(window._tplFilledText).then(()=>toast('Copied to clipboard!'));}
  else{const ta=document.createElement('textarea');ta.value=window._tplFilledText;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);toast('Copied!');}
}

}

  const t=DB.getTemplate(tplId);const o=DB.getOrder(orderId);

  const c=o.client_id?DB.getClient(o.client_id):null;
  const settings=DB.getSettings();
  let body=t.body||'';
  body=body.replace(/{client_name}/g,c?c.first_name+' '+c.last_name:'Customer');
  body=body.replace(/{order_number}/g,o.order_number||'—');
  body=body.replace(/{install_date}/g,o.install_date?fmt(o.install_date):'TBD');
  body=body.replace(/{balance_due}/g,dollar(Number(o.price||0)-Number(o.deposit_paid||0)));
  body=body.replace(/{company_name}/g,settings.company_name||'Oswego County Monument');
  body=body.replace(/{monument_type}/g,o.monument_type||'monument');
  document.getElementById('dp').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeDrawer()"><div class="drawer">
    <div class="dhandle"></div>
    <div class="dtitle">${esc(t.name)}</div>
    <pre style="font-size:14px;white-space:pre-wrap;line-height:1.7;color:#1c1a17;background:var(--green-light);padding:14px;border-radius:var(--radius-sm);border:1px solid #b8d8b8;margin-bottom:14px">${esc(body)}</pre>
    <div class="btn-row">
      <button class="btn btn-ghost" onclick="openCommTemplate('${orderId}')">← Back</button>

    ${c?.email?`<a href="mailto:${c.email}?subject=Order+%23${o.order_number}&body=${encodeURIComponent(body)}" class="btn btn-blue btn-full" style="margin-top:8px;display:flex;align-items:center;justify-content:center;gap:6px;background:var(--blue);color:#fff">📧 Open in Email</a>`:''}

function saveTemplate(id,isNew){
  const t=isNew?{id}:DB.getTemplate(id)||{id};

  DB.saveTemplate(t);toast(isNew?'Template created':'Template updated');closeDrawer();renderTemplates();
}

  });

function importData(e){
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=ev=>{try{DB.importAll(ev.target.result);toast('Import successful — reloading...');setTimeout(()=>location.reload(),1200);}catch(err){toast('Import failed: invalid file');}};
  reader.readAsText(file);e.target.value='';
}

  const o=DB.getOrder(orderId);if(!o)return;
  const c=o.client_id?DB.getClient(o.client_id):null;
  const cem=o.cemetery_id?DB.getCemetery(o.cemetery_id):null;
  const s=DB.getSettings();
  const lhr=Number(s.labor_rate||45);
  const totalCost=Number(o.material_cost||0)+Number(o.labor_hours||0)*lhr;
  const gm=o.price>0?((Number(o.price)-totalCost)/Number(o.price)*100).toFixed(1):'—';
  const coName=s.company_name||'Oswego County Monument';
  document.getElementById('print-area').innerHTML=`
  <div style="font-family:Georgia,serif;max-width:680px;margin:0 auto;padding:30px 20px;font-size:13px;line-height:1.6;color:#1c1a17">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #1a5fb4;padding-bottom:16px;margin-bottom:20px">
      <div><div style="font-size:22px;font-weight:700;color:#1a5fb4">${esc(coName)}</div>
      <div style="font-size:12px;color:#666">${s.company_address?esc(s.company_address)+'<br>':''} ${s.company_phone||''} ${s.company_email?'· '+s.company_email:''}</div></div>
      <div style="text-align:right"><div style="font-size:18px;font-weight:700">WORK ORDER</div><div style="color:#1a5fb4;font-weight:700;font-size:15px">#${o.order_number}</div><div style="font-size:12px;color:#666">Date: ${todayStr()}</div></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px">
      <div><div style="font-weight:700;border-bottom:1px solid #ddd;padding-bottom:4px;margin-bottom:8px">CUSTOMER</div>
        ${c?`<div style="font-weight:600">${c.first_name} ${c.last_name}</div><div>${c.address||''}</div><div>${c.phone||''} ${c.email||''}</div>`:'<div>—</div>'}
      </div>
      <div><div style="font-weight:700;border-bottom:1px solid #ddd;padding-bottom:4px;margin-bottom:8px">ORDER INFO</div>
        <div><strong>Status:</strong> ${esc(o.status)}</div>
        ${o.due_date?`<div><strong>Due Date:</strong> ${fmt(o.due_date)}</div>`:''}
        ${o.install_date?`<div><strong>Install Date:</strong> ${fmt(o.install_date)}</div>`:''}
        ${cem?`<div><strong>Cemetery:</strong> ${esc(cem.name)}</div>`:''}
        ${o.section_lot?`<div><strong>Section/Lot:</strong> ${esc(o.section_lot)}</div>`:''}
      </div>
    </div>
    ${(o.deceased_first||o.deceased_last)?`<div style="background:#f8f6f3;border:1px solid #e2ddd6;border-radius:6px;padding:12px;margin-bottom:16px">
      <div style="font-weight:700;margin-bottom:6px">DECEDENT INFORMATION</div>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;font-size:12px">
        <div><strong>Name:</strong> ${esc(o.deceased_first||'')} ${esc(o.deceased_last||'')}</div>
        ${o.deceased_dob?`<div><strong>Born:</strong> ${fmt(o.deceased_dob)}</div>`:''}
        ${o.deceased_dod?`<div><strong>Died:</strong> ${fmt(o.deceased_dod)}</div>`:''}
      </div>
    </div>`:''}
    ${o.is_veteran?`<div style="background:#1a3a6b;color:#d4af37;border-radius:6px;padding:10px 14px;margin-bottom:16px;font-weight:600">🎖 MILITARY VETERAN — ${o.vet_branch||''} · ${o.vet_conflict||''} · ${o.vet_rank||''}</div>`:''}
    <div style="border:1px solid #e2ddd6;border-radius:6px;overflow:hidden;margin-bottom:16px">
      <div style="background:#1a5fb4;color:#fff;padding:8px 12px;font-weight:700;font-size:12px;text-transform:uppercase">Monument Specifications</div>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:0;padding:12px;gap:8px;font-size:12px">
        ${o.monument_type?`<div><strong>Type:</strong> ${esc(o.monument_type)}</div>`:''}
        ${o.material?`<div><strong>Material:</strong> ${esc(o.material)}</div>`:''}
        ${o.color?`<div><strong>Color:</strong> ${esc(o.color)}</div>`:''}
        ${o.finish?`<div><strong>Finish:</strong> ${esc(o.finish)}</div>`:''}
        ${o.dimensions?`<div><strong>Dimensions:</strong> ${esc(o.dimensions)}</div>`:''}

      <div><div style="font-size:11px;color:#666;text-transform:uppercase">Deposit</div><div style="font-size:18px;font-weight:700;color:#2d6a2d">${dollar(o.deposit_paid||0)}</div></div>

    </div>
    ${o.notes?`<div style="margin-bottom:16px"><strong>Notes:</strong> ${esc(o.notes)}</div>`:''}
    <div style="border-top:2px solid #1a5fb4;padding-top:16px;margin-top:20px;font-size:11px;color:#666">
      <div style="margin-bottom:16px">${esc(s.agreement_footer||'Customer signature confirms approval of all design specifications.')}</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:40px">
        <div><div style="border-bottom:1px solid #1c1a17;margin-bottom:4px;height:30px"></div><div>Customer Signature / Date</div></div>
        <div><div style="border-bottom:1px solid #1c1a17;margin-bottom:4px;height:30px"></div><div>Authorized By / Date</div></div>
      </div>
    </div>
  </div>`;
  document.getElementById('print-area').style.display='block';
  setTimeout(()=>{window.print();document.getElementById('print-area').style.display='none';},200);
