function printInvoice(invId){
  const inv=DB.getInvoice(invId);if(!inv)return;
  const c=inv.client_id?DB.getClient(inv.client_id):null;
  const s=DB.getSettings();
  const balance=Number(inv.amount||0)-Number(inv.paid||0);
  document.getElementById('print-area').innerHTML=`
  <div style="font-family:Georgia,serif;max-width:600px;margin:0 auto;padding:30px 20px;font-size:13px;line-height:1.6;color:#1c1a17">
    <div style="display:flex;justify-content:space-between;border-bottom:2px solid #1a5fb4;padding-bottom:16px;margin-bottom:20px">
      <div><div style="font-size:20px;font-weight:700;color:#1a5fb4">${esc(s.company_name||'Oswego County Monument')}</div>
      <div style="font-size:12px;color:#666">${esc(s.company_address||'')} · ${esc(s.company_phone||'')} · ${esc(s.company_email||'')}</div></div>
      <div style="text-align:right"><div style="font-size:18px;font-weight:700">INVOICE</div><div style="font-weight:700;color:#1a5fb4">${esc(inv.inv_number||'')}</div></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:24px">
      <div><div style="font-weight:700;margin-bottom:4px">BILL TO</div>${c?`<div>${c.first_name} ${c.last_name}</div><div>${c.address||''}</div><div>${c.phone||''}</div>`:''}</div>
      <div style="text-align:right"><div><strong>Invoice Date:</strong> ${todayStr()}</div>${inv.due_date?`<div><strong>Due Date:</strong> ${fmt(inv.due_date)}</div>`:''}<div><strong>Status:</strong> ${esc(inv.status||'Unpaid')}</div></div>
    </div>
    <table style="width:100%;border-collapse:collapse;margin-bottom:20px">
      <thead><tr style="background:#f0ede8"><th style="text-align:left;padding:8px 12px">Description</th><th style="text-align:right;padding:8px 12px">Amount</th></tr></thead>
      <tbody><tr><td style="padding:10px 12px;border-bottom:1px solid #e2ddd6">${esc(inv.notes||'Monument services')}</td><td style="text-align:right;padding:10px 12px;border-bottom:1px solid #e2ddd6">${dollar(inv.amount||0)}</td></tr></tbody>
    </table>
    <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px;margin-bottom:20px">
      <div style="display:flex;gap:40px"><span>Subtotal:</span><span>${dollar(inv.amount||0)}</span></div>
      ${inv.paid>0?`<div style="display:flex;gap:40px;color:#2d6a2d"><span>Paid:</span><span>-${dollar(inv.paid)}</span></div>`:''}
      <div style="display:flex;gap:40px;font-size:16px;font-weight:700;border-top:2px solid #1a5fb4;padding-top:6px"><span>Balance Due:</span><span style="color:${balance>0?'#a02020':'#2d6a2d'}">${dollar(balance)}</span></div>
    </div>
    <div style="font-size:11px;color:#666;border-top:1px solid #e2ddd6;padding-top:12px">${esc(s.payment_terms||'')}</div>
  </div>`;
  document.getElementById('print-area').style.display='block';
  setTimeout(()=>{window.print();document.getElementById('print-area').style.display='none';},200);
}

        <div class="field"><label>Labor Hours</label><input type="number" id="of-labor-hrs" value="${o.labor_hours||''}" step="0.5" oninput="updateMarginDisplay()"></div>
      </div>
      <div class="margin-display">
        <div><div class="md-lbl">Labor Cost</div><div class="md-val" id="md-labor">${dollar(laborCost)}</div></div>
        <div><div class="md-lbl">Total Cost</div><div class="md-val" id="md-cost">${dollar(totalCost)}</div></div>
        <div><div class="md-lbl">Gross Margin</div><div class="md-val ${gmCls}" id="md-margin">${gm.toFixed(1)}%</div></div>
      </div>
    </div>
    <div class="fsec">
      <div class="fsec-title">🔗 Companion Monument</div>
      <div class="field"><select id="of-companion">
        <option value="">— No companion order —</option>
        ${orders.map(x=>{const cl=DB.getClient(x.client_id);return`<option value="${x.id}"${o.companion_order_id===x.id?' selected':''}>#${x.order_number}${cl?' – '+cl.first_name+' '+cl.last_name:''}</option>`;}).join('')}
      </select></div>
    </div>
    <div class="fsec">
      <div class="fsec-title">Notes</div>
      <div class="field"><textarea id="of-notes" rows="4">${esc(o.notes||'')}</textarea></div>
    </div>
    <div class="btn-row">
      <button class="btn btn-ghost" onclick="closeDrawer()">Cancel</button>
      <button class="btn btn-primary" onclick="saveOrderForm('${o.id}',${isNew})">
        <svg viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
        Save Order
      </button>
    </div>
  </div></div>`;
  if(o.inscription)setTimeout(()=>updateInscriptionPreview(o.inscription,'of-canvas'),80);
}

// ═══════════════════════ INIT ═══════════════════════
// ── UPDATED bootApp — syncs from Supabase before rendering ──────
const _origBootApp = bootApp;
bootApp = async function() {
  // Show loading state
  const app = document.getElementById('app');
  if (app) { app.style.display = 'flex'; }
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('topbar-title').textContent = 'Syncing…';

  // Pull fresh data from Supabase (falls back to local if offline)
  await DB.syncFromCloud();

  // Seed defaults if empty (first run)
  DB.seedLocations();
  DB.seedDefaultUser();
  DB.seedDefaultTemplates();

  const loc = AUTH.user?.location_id;
  curLoc = loc || null;
  renderLocBar();
  render('dashboard');
  // Show sync status so user knows if data is persisting to cloud
  setTimeout(()=>{
    const oCount = DB.getOrders().length;
    const cCount = DB.getClients().length;
    if (_supaConnected) toast(`☁️ Synced — ${oCount} orders · ${cCount} clients`);
    else toast('⚠️ Offline mode — data saves locally only');
  }, 900);
};

// ── INIT ────────────────────────────────────────────────────────
(async function init() {
  // Connect to Supabase (no-op if keys not configured yet)
  initSupabase();

  // Load local cache immediately so app is usable while cloud syncs
  DB._loadFromLocal();

  if (AUTH.load()) {
    await bootApp();
  } else {
    // Still seed defaults from local for login screen
    DB.seedLocations();
    DB.seedDefaultUser();
    renderLoginScreen();
  }
})();
</script>
</body>
</html>
